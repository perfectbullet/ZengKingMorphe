services:
  # BGE-Reranker-V2-M3: 文档重排序模型 (Reranker)
  bge-reranker:
    image: docker.m.daocloud.io/vllm/vllm-openai:v0.11.0
    container_name: bge-reranker-m3
    restart: unless-stopped
    ports:
      - "8091:8000"
    volumes:
      - ./models/bge-reranker-m3:/models/bge-reranker-m3:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    command: >
      --model /models/bge-reranker-m3
      --task score
      --served-model-name bge-reranker-m3
      --max-model-len 8192
      --host 0.0.0.0
      --port 8000
      --dtype float16
      --gpu-memory-utilization 0.2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    shm_size: '4gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # BGE-M3: 多语言文本嵌入模型 (Embedding)
  bge-m3:
    image: docker.m.daocloud.io/vllm/vllm-openai:v0.11.0
    container_name: bge-m3
    restart: unless-stopped
    ports:
      - "8092:8000"
    volumes:
      - ./models/BAAI/bge-m3:/model/BAAI/bge-m3:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    command: >
      --model /model/BAAI/bge-m3
      --task embed
      --served-model-name BAAI/bge-m3
      --max-model-len 8192
      --host 0.0.0.0
      --port 8000
      --dtype float16
      --gpu-memory-utilization 0.3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    shm_size: '4gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

networks:
  default:
    name: reranker-network
