name: digital-employee-platform
services:
  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: digital-employee-ai
    ports:
      - "8100:8100"
    volumes:
      - ./ai-service:/app
      - ./outer_api_docs:/app/outer_api_docs
      - ai-chroma-data:/app/chroma_db
      - ai-logs:/app/logs
    env_file:
      - ./ai-service/.env
    depends_on:
      - elasticsearch
      - chroma
    extra_hosts:
      - "host.docker.internal:172.21.0.1"
    networks:
      - digital-employee-network
    restart: unless-stopped

  # Chroma Vector Database
  chroma:
    image: chromadb/chroma:0.6.3  # Using stable version instead of 'latest' for consistency
    container_name: digital-employee-chroma
    ports:
      - "8200:8200"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_HOST_PORT=8200
    networks:
      - digital-employee-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ElasticSearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: digital-employee-elasticsearch
    ports:
      - "9200:9200"
      - "9330:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - digital-employee-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  chroma-data:
    driver: local
  ai-chroma-data:
    driver: local
  es-data:
    driver: local
  ai-logs:
    driver: local

networks:
  digital-employee-network:
    driver: bridge
