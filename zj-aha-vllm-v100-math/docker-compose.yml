services:
  qwen3-14b-awq:
    image: zj/vllm-zj-v100:v20260530
    container_name: zj-vllm-math
    restart: unless-stopped

    ports:
      - "8200:8200"

    volumes:
      - /data/metahuman_work/models:/models

    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3"
      CUDA_VISIBLE_DEVICES: "0,1,2,3"

    gpus:
      - count: 4
        capabilities: [gpu]

    command:
      - /models/Qwen3-32B
      - --served-model-name
      - Qwen3-32B
      - --host
      - 0.0.0.0
      - --port
      - "8200"
      - --dtype
      - float16
      - --tensor-parallel-size
      - "4"
      - --max-model-len
      - "40960"
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-seqs
      - "4"