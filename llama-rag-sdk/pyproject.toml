[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-rag-sdk"
version = "0.1.0"
description = "基于 LlamaIndex 的 RAG SDK，支持教材文档解析和智能检索"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "ZengKing", email = "dev@zengking.com"}
]
license = {text = "MIT"}
keywords = ["rag", "llamaindex", "document-parsing", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # 核心依赖
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-openai>=0.1.0",
    "llama-index-vector-stores-chroma>=0.1.0",
    "llama-index-postprocessor-cohere-rerank>=0.1.0",

    # vLLM 集成（OpenAI 兼容 API）
    "openai>=1.0.0",

    # Ollama 集成（暂用于 Qwen2-VL 图片描述）
    "ollama>=0.1.0",

    # 存储和工具
    "chromadb>=0.4.0",
    "python-dotenv>=1.0.0",

    # HTTP 客户端
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",

    # 数据处理
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # 日志
    "loguru>=0.7.0",

    # 工具
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

image = [
    "Pillow>=10.0.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "qwen-vl-utils>=0.0.1",
]

all = [
    "llama-rag-sdk[dev,image]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
