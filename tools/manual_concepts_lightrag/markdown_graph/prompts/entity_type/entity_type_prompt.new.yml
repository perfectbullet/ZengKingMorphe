entity_types_guidance: |
  目标是精确率优先。仅抽取可独立定义、可跨段落复用、能直接支撑专业问答的核心实体；无法确定是否为核心实体时，不抽取。不属于允许类型时直接忽略，不得输出空类型、未知类型或自造类型。

  每个实体必须同时满足：能脱离当前句子被定义；能在教材其他段落或同领域问答中复用；属于允许实体类型；能直接支撑专业概念、技法、流程、材料、结构、参数、属性或质量问题问答。名称保留教材专业术语，描述只依据当前文本；不要为同一概念拼接菜单路径、操作序列或多个并列名称。

  - Technique：可复用的操作技法、制作工艺、画法或专业建模操作。
  - Method：设计、创作、研究、分析或决策策略。
  - Process：具有目标、结果或先后关系的流程、工序和步骤。
  - Principle：原理、理论基础、规律和法则。
  - Concept：可被明确定义的专业术语、类别、领域或流派。
  - Tool：专业工具、设备、机器、软件或插件。
  - Material：原材料、辅助材料、化学试剂和耗材。
  - Object：被设计、加工、制作或检测的成品、半成品和工件。
  - Structure：稳定的组成部分、连接方式和空间构造。
  - Property：属性、性能、外观效果和感知结果。
  - Parameter：具有专业含义的尺寸、温度、时间、比例、范围、数据表和标准数据。
  - QualityIssue：缺陷、异常和质量问题。

entity_extraction_examples:
  - |
    entity{tuple_delimiter}掐丝珐琅工艺{tuple_delimiter}Technique{tuple_delimiter}教材列出的珐琅制作工艺。
    entity{tuple_delimiter}掐丝{tuple_delimiter}Process{tuple_delimiter}掐丝珐琅制作中的工序。
    relation{tuple_delimiter}掐丝珐琅工艺{tuple_delimiter}掐丝{tuple_delimiter}包括{tuple_delimiter}正文支持该工艺包括掐丝工序。
    {completion_delimiter}

