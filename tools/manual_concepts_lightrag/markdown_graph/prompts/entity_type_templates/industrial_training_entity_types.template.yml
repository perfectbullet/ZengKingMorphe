# Per-book profile. LightRAG consumes the three native fields below; the other
# fields are pipeline validation metadata and never contain secrets.
profile_version: markdown_graph_entity_profile.v1
book_id: "{{book_id}}"
book_title: "{{book_title}}"
domain: "{{domain}}"
subject: "{{subject}}"
language: Chinese
allowed_entity_types: [Technique, Tool, Material, Object, VisualEffect, Process, Parameter, Concept]
allowed_relation_keywords: [使用, 用于, 包括, 组成, 影响, 产生, 需要, 适用于, 表现, 形成]
entity_types_guidance: |
  Extract only high-value entities explicitly stated in the current input text.
  Keep entity names exactly as written in the source text. Do not silently correct OCR or ASR variants.
  Do not use Other. Do not extract figure/page/chapter numbers, URLs, image paths, hashes,
  author names, brand names, one-off works, or ordinary action words. Numeric values belong in descriptions.
  Relationships require direct textual evidence and both endpoints must be valid extracted entities.
entity_extraction_examples:
  - |
    entity<|#|>拓稿<|#|>Technique<|#|>拓稿是正文中明确出现的珠宝手绘工艺步骤。
    entity<|#|>硫酸纸<|#|>Material<|#|>硫酸纸用于承载拓稿线条。
    entity<|#|>透台<|#|>Tool<|#|>透台用于辅助观察和描绘线条。
    relation<|#|>拓稿<|#|>硫酸纸<|#|>使用<|#|>正文说明拓稿使用硫酸纸。
    <|COMPLETE|>
  - |
    entity<|#|>两点透视<|#|>Technique<|#|>两点透视用于表现珠宝首饰效果图的空间关系。
    entity<|#|>珠宝首饰效果图<|#|>Object<|#|>珠宝首饰效果图是正文讨论的表现对象。
    entity<|#|>立体感<|#|>VisualEffect<|#|>立体感是两点透视产生的视觉效果。
    relation<|#|>两点透视<|#|>立体感<|#|>产生<|#|>正文直接说明两点透视能够表现立体感。
    <|COMPLETE|>
entity_extraction_json_examples:
  - |
    {"entities":[{"name":"拉丝肌理","type":"VisualEffect","description":"拉丝肌理是正文明确出现的金属表面视觉效果。"},{"name":"排线","type":"Technique","description":"排线是形成拉丝肌理的表现技法。"},{"name":"金属","type":"Material","description":"金属是承载拉丝肌理的材料。"}],"relationships":[{"source":"排线","target":"拉丝肌理","keywords":"表现","description":"正文直接说明排线表现拉丝肌理。"},{"source":"拉丝肌理","target":"金属","keywords":"形成","description":"正文说明拉丝肌理形成于金属表面。"}]}
