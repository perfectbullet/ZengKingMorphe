services:
  zj-vllm-dev:
    image: vllm/vllm-openai:v0.11.0
    container_name: zj-vllm-dev

    restart: unless-stopped

    ports:
      - "8200:8200"

    volumes:
      - /data/metahuman_work/models:/models

    entrypoint:
      - vllm
      - serve

    command:
      - /models/Qwen3-14B-AWQ
      - --served-model-name
      - Qwen3-14B-AWQ
      - --host
      - 0.0.0.0
      - --port
      - "8200"
      - --dtype
      - auto
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "15360"
      - --gpu-memory-utilization
      - "0.8"
      - --quantization
      - awq_marlin
      - --max-num-seqs
      - "4"
      - --chat-template
      - /models/Qwen3-14B-AWQ/qwen3_nonthinking.jinja

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
              capabilities:
                - gpu