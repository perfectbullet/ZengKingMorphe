services:
  qwen3-14b-awq:
    image: zj/vllm-openai-v100:20260531
    container_name: zj-vllm
    restart: unless-stopped

    ports:
      - "8200:8200"

    volumes:
      - /nfs-data/metahuman_work/models:/models

    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"

    gpus:
      - device_ids: ["0"]
        capabilities: [gpu]

    command:
      - /models/Qwen3-14B-AWQ
      - --served-model-name
      - Qwen3-14B-AWQ
      - --host
      - 0.0.0.0
      - --port
      - "8200"
      - --dtype
      - auto
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "10240"
      - --gpu-memory-utilization
      - "0.50"
      - --quantization
      - awq
      - --max-num-seqs
      - "4"
      - --chat-template
      - /models/Qwen3-14B-AWQ/qwen3_nonthinking.jinja